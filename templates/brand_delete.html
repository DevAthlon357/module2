{% extends 'components/base.html' %}
{% load static %}
{% block title %} Axion | Brand Delete {% endblock %}

{% block body %}
<h1 class="text-center">Brand Delete</h1>
<a href="/car/list/" class="btn btn-success">Go Back To Car list Page</a>

<div>
    <div class="modal-dialog">
        <form class="modal-content" method="POST" action="/brand/delete/{{brand.id}}/">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title">{{brand.name}}</h5>
               
            </div>
            <div class="modal-body">
                <p>Are you sure want to delete?</p>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-success">Yes</button>
                <button type="button" onclick="window.location.href='/car/list/'" class="btn btn-danger">No</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
