
{% extends 'components/base.html' %}
{% load static %}
{% block title %}Axion | Payment {% endblock %}

{% block body %}

<style>
    .payment-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 40px 20px;
    }

    .payment-card {
        background: white;

        padding: 30px;

        border-radius: 18px;

        width: 100%;
        max-width: 420px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .payment-card h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 42px;
        font-weight: 700;
    }

    .amount {
        text-align: center;
        font-size: 22px;
        margin-bottom: 25px;
    }

    .methods {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .methods label {
        display: flex;
        align-items: center;
        gap: 14px;

        padding: 14px;

        border: 1px solid #ddd;
        border-radius: 12px;

        cursor: pointer;

        transition: 0.3s;
    }

    .methods label:hover {
        border-color: purple;
        background: #faf6ff;
    }

    .methods input[type="radio"] {
        width: 18px;
        height: 18px;
    }

    .logo {
        width: 42px;
        height: 42px;
        object-fit: contain;

        background: white;
        border-radius: 10px;
        padding: 5px;
    }

    .upload-box {
        margin-top: 25px;
    }

    .upload-box h3 {
        margin-bottom: 12px;
        font-size: 20px;
        font-weight: 600;
    }

    input[type="file"] {
        width: 100%;

        padding: 12px;

        border: 1px solid #ddd;
        border-radius: 10px;

        background: white;
    }

    .pay-btn {
        margin-top: 25px;

        width: 100%;

        padding: 14px;

        border: none;
        border-radius: 12px;

        background: linear-gradient(45deg, purple, pink);

        color: white;
        font-size: 18px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.3s;
    }

    .pay-btn:hover {
        transform: translateY(-2px);
        opacity: 0.95;
    }

   
</style>


    <div class="payment-wrapper">
        <div class="payment-card">
        <h2>Payment</h2>

        <div class="amount">
            Total: <strong>${{ booking.total_price }}</strong>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="methods">

                <label>
                    <input type="radio" name="method" value="wave" required>
                    <img src="{% static 'assets/wave.png' %}" class="logo">
                    Wave Pay - 09-443412110
                </label>

                <label>
                    <input type="radio" name="method" value="kbz">
                    <img src="{% static 'assets/kbz.png' %}" class="logo">
                    KBZ Pay - 09-443412110
                </label>

                <label>
                    <input type="radio" name="method" value="uab">
                    <img src="{% static 'assets/uab.png' %}" class="logo">
                    UAB Account - 41551120901504601
                </label>
                <label>
                    <input type="radio" name="method" value="kbz">
                    <img src="{% static 'assets/aya.png' %}" class="logo">
                    AYA Pay - 09-443412110
                </label>
            </div>

           
            <div class="upload-box">

                <h3>Payment Screenshot</h3>

                <input type="file" name="screenshot" accept="image/*" required>

            </div>

        <button type="submit" class="pay-btn">
            Pay Now
        </button>

        </form>
    </div>
    </div>

    <script>
        document.querySelectorAll("label").forEach(label => {
            label.addEventListener("click", () => {
                document.querySelectorAll("label").forEach(l => l.style.borderColor = "#ddd");
                label.style.borderColor = "purple";
            });
        });
    </script>

{% endblock %}
